name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint (syntax errors, undefined names, unused imports)
        run: |
          python -m pip install flake8
          python -m flake8 . --select=E9,F63,F7,F82,F401,F841 --count --show-source
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests
      - name: Check this repository with itself
        run: python preflight.py . --fail-on error --no-dates
